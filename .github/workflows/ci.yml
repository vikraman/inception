name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AGDA_VERSION: "2.8.0.2"
  STDLIB_VERSION: "2.4"
  GHC_VERSION: "9.14.1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Haskell
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: latest

      - name: Cache cabal
        id: cabal-cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            ~/.cabal/packages
            ~/.cabal/script-builds
          key: ${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-agdalint-${{ hashFiles('scripts/AgdaLint.hs') }}
          restore-keys: ${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-agdalint-

      - name: Update package index
        if: steps.cabal-cache.outputs.cache-hit != 'true'
        run: cabal update

      - name: Lint
        run: make lint

  agda:
    name: agda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Agda
        id: agda
        uses: ./.github/actions/setup-agda
        with:
          agda-version: ${{ env.AGDA_VERSION }}
          stdlib-version: ${{ env.STDLIB_VERSION }}
          cache-name: check

      - name: Check
        run: |
          agda --version
          make -j"$(nproc)"

      - name: Save interface files
        if: always() && steps.agda.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.agda.outputs.cache-paths }}
          key: ${{ steps.agda.outputs.cache-key }}

  html:
    name: html
    needs: [lint, agda]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Agda
        id: agda
        uses: ./.github/actions/setup-agda
        with:
          agda-version: ${{ env.AGDA_VERSION }}
          stdlib-version: ${{ env.STDLIB_VERSION }}
          cache-name: html
          cache-fallbacks: check

      - name: Generate html
        run: |
          ./index.sh
          make html

      - name: Save interface files
        if: always() && steps.agda.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.agda.outputs.cache-paths }}
          key: ${{ steps.agda.outputs.cache-key }}

      - name: Deploy html
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: html
