name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AGDA_VERSION: "2.8.0.2"
  STDLIB_VERSION: "2.4"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Lint
        uses: vikraman/agda-lint@v0.1.1
        with:
          reviewdog: github-pr-review

  agda:
    name: agda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Agda
        id: agda
        uses: ./.github/actions/setup-agda
        with:
          agda-version: ${{ env.AGDA_VERSION }}
          stdlib-version: ${{ env.STDLIB_VERSION }}
          cache-name: check

      - name: Check
        run: |
          agda --version
          make -j"$(nproc)"

      - name: Save interface files
        if: always() && steps.agda.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.agda.outputs.cache-paths }}
          key: ${{ steps.agda.outputs.cache-key }}

  html:
    name: html
    needs: [lint, agda]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Agda
        id: agda
        uses: ./.github/actions/setup-agda
        with:
          agda-version: ${{ env.AGDA_VERSION }}
          stdlib-version: ${{ env.STDLIB_VERSION }}
          cache-name: html
          cache-fallbacks: check

      - name: Generate html
        run: |
          scripts/unliterate.sh
          make html

      - name: Save interface files
        if: always() && steps.agda.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.agda.outputs.cache-paths }}
          key: ${{ steps.agda.outputs.cache-key }}

      - name: Deploy html
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: html
